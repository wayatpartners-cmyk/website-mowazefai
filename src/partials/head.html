<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{SITE}}{{PATH}}">
<link rel="alternate" hreflang="ar" href="{{SITE}}{{AR_PATH}}">
<link rel="alternate" hreflang="en" href="{{SITE}}{{EN_PATH}}">
<link rel="alternate" hreflang="x-default" href="{{SITE}}{{AR_PATH}}">
<meta name="robots" content="{{ROBOTS}}">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:locale:alternate" content="{{OG_LOCALE_ALT}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{SITE}}{{PATH}}">
<meta property="og:image" content="{{SITE}}/assets/img/og-{{LANG}}.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{SITE}}/assets/img/og-{{LANG}}.jpg">

<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='dark'&&t!=='light'){t='dark'}d.setAttribute('data-theme',t);d.classList.add('js');try{if(sessionStorage.getItem('intro')||matchMedia('(prefers-reduced-motion: reduce)').matches){d.classList.add('intro-seen')}else{sessionStorage.setItem('intro','1');d.classList.add('intro-on')}}catch(e){d.classList.add('intro-seen')}if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#FFFFFF')}})();</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONTS}}">
<link rel="stylesheet" href="/assets/css/site.css?v={{VERSION}}">
<script src="/assets/js/site.js?v={{VERSION}}" defer></script>
</head>
<body>
<div class="intro" aria-hidden="true"><svg class="intro-m" viewBox="-6 -6 394 371"><path pathLength="1" d="M19 0L191 188L364 0V334H382V359H299V334H316V122L191 257L67 122V334H84V359H0V334H19Z"/><path pathLength="1" d="M191 281L229 319L191 357L153 319Z"/></svg></div>
<a class="skip-link" href="#main">{{SKIP}}</a>
<div class="scroll-progress" aria-hidden="true"></div>
