<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{SITE}}{{PATH}}">
<link rel="alternate" hreflang="ar" href="{{SITE}}{{AR_PATH}}">
<link rel="alternate" hreflang="en" href="{{SITE}}{{EN_PATH}}">
<link rel="alternate" hreflang="x-default" href="{{SITE}}{{AR_PATH}}">
<meta name="robots" content="{{ROBOTS}}">
<meta name="theme-color" content="#F7F5F0">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:locale:alternate" content="{{OG_LOCALE_ALT}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{SITE}}{{PATH}}">
<meta property="og:image" content="{{SITE}}/assets/img/og-{{LANG}}.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{SITE}}/assets/img/og-{{LANG}}.jpg">

<script>document.documentElement.classList.add("js");</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="{{FONTS}}" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{FONTS}}"></noscript>
<style>{{CSS}}</style>
<script src="/assets/js/site.js?v={{VERSION}}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">{{SKIP}}</a>
