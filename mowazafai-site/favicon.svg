<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="موظف AI">
  <defs>
    <radialGradient id="body" cx="30%" cy="16%" r="120%">
      <stop offset="0%" stop-color="#2C8A82"/>
      <stop offset="46%" stop-color="#0F4B47"/>
      <stop offset="100%" stop-color="#062724"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0DFA8"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8E6E12"/>
    </linearGradient>
  </defs>

  <!-- زر السيليكون البترولي -->
  <circle cx="32" cy="32" r="32" fill="url(#body)"/>
  <!-- حلقة سونار نحاسية واحدة: تحت ٤٨px تُحذف الحلقة الخارجية -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#C9A227" stroke-opacity=".9" stroke-width="3"/>
  <!-- النواة -->
  <circle cx="32" cy="32" r="9" fill="url(#core)"/>
  <!-- هايلايت علوي -->
  <ellipse cx="26" cy="14" rx="17" ry="8" fill="#fff" opacity=".28"/>
</svg>
